<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinSentinel - AI Finance Controller</title>
    <link rel="manifest" href="/manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { slate: { 850: '#151e2e' } },
                    animation: {
                        'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'slide-in-right': 'slideInRight 0.3s ease-out forwards',
                        'slide-up': 'slideUp 0.3s ease-out forwards',
                    },
                    keyframes: {
                        slideInRight: { '0%': { transform: 'translateX(100%)' }, '100%': { transform: 'translateX(0)' } },
                        slideUp: { '0%': { transform: 'translateY(100%)', opacity: 0 }, '100%': { transform: 'translateY(0)', opacity: 1 } }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
    <script src="https://unpkg.com/prop-types@15.6/prop-types.js" crossorigin></script>
    <script src="https://unpkg.com/recharts@2.12.0/umd/Recharts.js" crossorigin></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <style>
        body { background-color: #f1f5f9; color: #0f172a; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; transition: background-color 0.3s, color 0.3s; }
        .dark body { background-color: #0f172a; color: #f8fafc; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .dark ::-webkit-scrollbar-thumb { background: #334155; }
        .recharts-cartesian-grid-horizontal line, .recharts-cartesian-grid-vertical line { stroke: #e2e8f0; }
        .dark .recharts-cartesian-grid-horizontal line, .dark .recharts-cartesian-grid-vertical line { stroke: #1e293b; }
    </style>
</head>
<body>
    <div id="root"></div>
    <div id="error-log" style="color: red; padding: 20px; font-family: monospace;"></div>
    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            document.getElementById('error-log').innerHTML += '<p>' + message + ' at ' + lineno + ':' + colno + '</p>';
        };
        Babel.registerPreset("react-classic", { presets: [[Babel.availablePresets["react"], { runtime: "classic" }]] });
        
        // FIREBASE CONFIGURATION (Add your config here)
        const firebaseConfig = {};
        
        let usingMockAuth = false;
        try {
            if(Object.keys(firebaseConfig).length > 0) {
                firebase.initializeApp(firebaseConfig);
            } else {
                usingMockAuth = true;
                console.warn("No Firebase Config found. Using Mock Auth Mode.");
            }
        } catch(e) { usingMockAuth = true; }
    </script>
    <script type="text/babel" data-presets="react-classic">
        const { useState, useEffect, useRef } = React;
        const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, Area, ComposedChart } = window.Recharts;

        // Icons
        const IconSearch = ({className}) => <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>;
        const IconAlertTriangle = ({className}) => <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>;
        const IconBarChart = ({className}) => <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>;
        const IconShieldCheck = ({className}) => <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>;
        const IconBrain = ({className}) => <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" /></svg>;
        const IconCheckCircle = ({className}) => <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>;
        const IconX = ({className}) => <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>;
        const IconClock = ({className}) => <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>;
        const IconRefresh = ({className}) => <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>;
        const IconMoon = ({className}) => <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>;
        const IconSun = ({className}) => <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>;
        const IconChat = ({className}) => <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" /></svg>;
        const IconPlay = ({className}) => <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>;

        const colors = {
            blue: { border: 'border-blue-500/50', shadow: 'dark:shadow-[0_0_15px_rgba(59,130,246,0.2)]', text: 'text-blue-600 dark:text-blue-400', bg: 'bg-blue-100 dark:bg-blue-500/10', bgSolid: 'bg-blue-500' },
            amber: { border: 'border-amber-500/50', shadow: 'dark:shadow-[0_0_15px_rgba(245,158,11,0.2)]', text: 'text-amber-600 dark:text-amber-400', bg: 'bg-amber-100 dark:bg-amber-500/10', bgSolid: 'bg-amber-500' },
            emerald: { border: 'border-emerald-500/50', shadow: 'dark:shadow-[0_0_15px_rgba(16,185,129,0.2)]', text: 'text-emerald-600 dark:text-emerald-400', bg: 'bg-emerald-100 dark:bg-emerald-500/10', bgSolid: 'bg-emerald-500' },
            purple: { border: 'border-purple-500/50', shadow: 'dark:shadow-[0_0_15px_rgba(168,85,247,0.2)]', text: 'text-purple-600 dark:text-purple-400', bg: 'bg-purple-100 dark:bg-purple-500/10', bgSolid: 'bg-purple-500' },
            indigo: { border: 'border-indigo-500/50', shadow: 'dark:shadow-[0_0_15px_rgba(99,102,241,0.2)]', text: 'text-indigo-600 dark:text-indigo-400', bg: 'bg-indigo-100 dark:bg-indigo-500/10', bgSolid: 'bg-indigo-500' },
            slate: { border: 'border-slate-500/50', shadow: 'dark:shadow-[0_0_15px_rgba(100,116,139,0.2)]', text: 'text-slate-600 dark:text-slate-400', bg: 'bg-slate-200 dark:bg-slate-500/10', bgSolid: 'bg-slate-500' }
        };

        const AgentCard = ({ agent, isExpanded, onClick }) => {
            const c = colors[agent.color];
            const isWorking = agent.status === 'Scanning' || agent.status === 'Flagged Issue';
            
            return (
                <div onClick={onClick} className={`bg-white dark:bg-slate-800/80 border rounded-xl p-4 cursor-pointer transition-all duration-300 relative overflow-hidden ${isWorking ? c.border + ' ' + c.shadow : 'border-slate-300 dark:border-slate-700 hover:border-slate-400 dark:hover:border-slate-500'}`}>
                    {isWorking && <div className={`absolute top-0 left-0 w-full h-1 ${c.bgSolid} opacity-50 animate-pulse`}></div>}
                    <div className="flex justify-between items-start mb-3">
                        <div className={`p-2 rounded-lg ${c.bg} ${c.text}`}><agent.icon className="w-5 h-5" /></div>
                        <div className="flex items-center gap-1.5">
                            {isWorking && <span className="relative flex h-2 w-2">
                                <span className={`animate-ping absolute inline-flex h-full w-full rounded-full ${c.bgSolid} opacity-75`}></span>
                                <span className={`relative inline-flex rounded-full h-2 w-2 ${c.bgSolid}`}></span>
                            </span>}
                            <span className={`text-xs font-medium ${isWorking ? c.text : 'text-slate-500'}`}>{agent.status}</span>
                        </div>
                    </div>
                    <h3 className="font-semibold text-slate-800 dark:text-slate-200">{agent.name}</h3>
                    <p className="text-xs text-slate-500 dark:text-slate-400 mt-1 line-clamp-1">{agent.role}</p>
                    <div className={`grid transition-all duration-300 ease-in-out ${isExpanded ? 'grid-rows-[1fr] opacity-100 mt-4' : 'grid-rows-[0fr] opacity-0'}`}>
                        <div className="overflow-hidden">
                            <div className="border-t border-slate-200 dark:border-slate-700 pt-3">
                                <div className="text-xs text-slate-500 mb-2 font-semibold tracking-wider">REASONING LOG</div>
                                <div className="space-y-1.5 max-h-32 overflow-y-auto pr-1">
                                    {agent.log.map((l, i) => (
                                        <div key={i} className="text-xs font-mono text-slate-600 dark:text-slate-300 flex items-start gap-2">
                                            <span className="text-slate-400 dark:text-slate-600">&gt;</span> <span>{l}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [token, setToken] = useState("");
            const [isDark, setIsDark] = useState(true);
            const [agents, setAgents] = useState([
                { id: 'recon', name: 'Reconciliation', role: 'Matches payments', status: 'Scanning', color: 'blue', icon: IconSearch, log: ['Initiated daily scan.'] },
                { id: 'anomaly', name: 'Anomaly & Leakage', role: 'Detects missing credits', status: 'Idle', color: 'amber', icon: IconAlertTriangle, log: ['Standing by.'] },
                { id: 'forecast', name: 'Forecasting', role: 'Projects 90-day cash flow', status: 'Resolved', color: 'emerald', icon: IconBarChart, log: ['Forecast model trained.'] },
                { id: 'compliance', name: 'Compliance', role: 'Checks GST/TDS', status: 'Scanning', color: 'purple', icon: IconShieldCheck, log: ['Checking mappings.'] },
                { id: 'orchestrator', name: 'Orchestrator', role: 'Coordinates & summarizes', status: 'Resolved', color: 'indigo', icon: IconBrain, log: ['System nominal.'] }
            ]);
            const [transactions, setTransactions] = useState([]);
            const [delayDays, setDelayDays] = useState(0);
            const [volumeMult, setVolumeMult] = useState(1.0);
            const [chartData, setChartData] = useState([]);
            const [briefText, setBriefText] = useState("Loading brief...");
            const [auditLog, setAuditLog] = useState([]);
            const [calendar, setCalendar] = useState([]);
            const [chatOpen, setChatOpen] = useState(false);
            const [chatMsgs, setChatMsgs] = useState([{role: 'assistant', text: 'Hello! I am your FinSentinel Copilot. Ask me anything about your cash flow or anomalies.'}]);
            const [chatInput, setChatInput] = useState("");
            const chatEndRef = useRef(null);

            const [expandedAgent, setExpandedAgent] = useState(null);

            useEffect(() => {
                document.documentElement.classList.toggle('dark', isDark);
            }, [isDark]);
            
            useEffect(() => { chatEndRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [chatMsgs]);

            // Authentication Setup
            useEffect(() => {
                if(usingMockAuth) {
                    setUser({ displayName: "Demo User", email: "demo@finsentinel.ai", tenantId: "demo-tenant" });
                    setToken("mock-token");
                } else {
                    const unsubscribe = firebase.auth().onAuthStateChanged(async (u) => {
                        if (u) {
                            setUser(u);
                            setToken(await u.getIdToken());
                        } else {
                            setUser(null);
                            setToken("");
                        }
                    });
                    return () => unsubscribe();
                }
            }, []);

            const login = () => {
                if(usingMockAuth) {
                    setUser({ displayName: "Demo User", email: "demo@finsentinel.ai", tenantId: "demo-tenant" });
                    setToken("mock-token");
                } else {
                    const provider = new firebase.auth.GoogleAuthProvider();
                    firebase.auth().signInWithPopup(provider).catch(e => alert(e.message));
                }
            };

            const logout = () => {
                if(usingMockAuth) { setUser(null); setToken(""); }
                else firebase.auth().signOut();
            };

            const myFetch = async (url) => {
                return fetch(url, { headers: { 'Authorization': 'Bearer ' + token } }).then(r => r.json());
            };

            useEffect(() => {
                if(!user) return;
                
                const interval = setInterval(() => {
                    myFetch('/agents/status').then(data => {
                        setAgents(prev => prev.map(a => (data[a.id] ? { ...a, status: data[a.id].status, log: data[a.id].log } : a)));
                    }).catch(console.error);
                    
                    myFetch('/agents/audit-log').then(data => setAuditLog(data.reverse().slice(0, 50))).catch(console.error);
                }, 2000);
                
                myFetch('/agents/calendar').then(setCalendar).catch(console.error);
                generateBrief();
                
                const es = new EventSource('/agents/feed?token=' + token);
                es.onmessage = (event) => setTransactions(prev => [JSON.parse(event.data), ...prev].slice(0, 50));
                
                return () => { clearInterval(interval); es.close(); };
            }, [user, token]);

            useEffect(() => {
                if(!user) return;
                myFetch(`/agents/forecast?delayDays=${delayDays}&volumeMultiplier=${volumeMult}`)
                    .then(setChartData).catch(console.error);
            }, [user, token, delayDays, volumeMult]);

            const generateBrief = () => {
                myFetch('/agents/brief').then(data => setBriefText(data.summary)).catch(console.error);
            };

            const playVoiceBrief = () => {
                if ('speechSynthesis' in window) {
                    const utterance = new SpeechSynthesisUtterance(briefText);
                    window.speechSynthesis.speak(utterance);
                } else alert("Speech synthesis not supported in this browser.");
            };
            
            const sendChat = async (e) => {
                e.preventDefault();
                if(!chatInput.trim()) return;
                const userText = chatInput;
                setChatMsgs(prev => [...prev, {role: 'user', text: userText}, {role: 'assistant', text: '...'}]);
                setChatInput("");
                try {
                    const res = await myFetch('/agents/chat?question=' + encodeURIComponent(userText));
                    setChatMsgs(prev => {
                        const next = [...prev];
                        next[next.length - 1] = {role: 'assistant', text: res.answer};
                        return next;
                    });
                } catch(e) {
                    setChatMsgs(prev => {
                        const next = [...prev];
                        next[next.length - 1] = {role: 'assistant', text: "Error: Could not reach Copilot."};
                        return next;
                    });
                }
            };

            if (!user) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-50 dark:bg-slate-900 p-4 transition-colors">
                        <div className="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl p-8 max-w-md w-full shadow-2xl text-center">
                            <div className="bg-emerald-500/20 p-4 rounded-full border border-emerald-500/30 w-20 h-20 mx-auto mb-6 flex items-center justify-center">
                                <IconShieldCheck className="w-10 h-10 text-emerald-500" />
                            </div>
                            <h1 className="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-emerald-500 to-blue-500 mb-2">FinSentinel</h1>
                            <p className="text-slate-500 dark:text-slate-400 mb-8">AI-Powered Multi-Agent Finance Controller</p>
                            
                            <button onClick={login} className="w-full bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-semibold py-3 px-4 rounded-lg hover:bg-slate-800 dark:hover:bg-slate-200 transition-colors flex items-center justify-center gap-3 shadow-lg active:scale-95">
                                <svg className="w-5 h-5" viewBox="0 0 24 24"><path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                                {usingMockAuth ? 'Enter Demo Mode' : 'Sign in with Google'}
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen p-4 md:p-8">
                    <header className="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
                        <div className="flex items-center gap-4">
                            <div className="bg-emerald-500/20 p-2.5 rounded-xl border border-emerald-500/30">
                                <IconShieldCheck className="w-8 h-8 text-emerald-500" />
                            </div>
                            <div>
                                <h1 className="text-2xl md:text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-emerald-500 to-blue-500">FinSentinel</h1>
                                <p className="text-slate-500 dark:text-slate-400 text-sm mt-0.5">Multi-Agent Finance Controller</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-4">
                            <button onClick={() => setIsDark(!isDark)} className="p-2 rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 transition-colors">
                                {isDark ? <IconSun className="w-5 h-5"/> : <IconMoon className="w-5 h-5"/>}
                            </button>
                            <div className="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-3 py-1.5 rounded-lg flex items-center gap-3">
                                <div className="text-right">
                                    <div className="text-sm font-semibold">{user.displayName || 'User'}</div>
                                    <div className="text-xs text-slate-500 dark:text-slate-400">{usingMockAuth ? 'Demo Business' : 'Finance Controller'}</div>
                                </div>
                                <button onClick={logout} className="text-xs font-semibold text-rose-500 hover:text-rose-600 border border-rose-500/30 hover:bg-rose-500/10 px-2 py-1 rounded">Logout</button>
                            </div>
                        </div>
                    </header>

                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4 mb-8">
                        {agents.map(agent => (
                            <AgentCard 
                                key={agent.id} 
                                agent={agent} 
                                isExpanded={expandedAgent === agent.id}
                                onClick={() => setExpandedAgent(expandedAgent === agent.id ? null : agent.id)}
                            />
                        ))}
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
                        <div className="lg:col-span-2 space-y-6">
                            <div className="bg-white dark:bg-slate-850 border border-slate-200 dark:border-slate-700 rounded-xl p-6 shadow-sm dark:shadow-lg">
                                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                                    <h2 className="text-lg font-semibold flex items-center gap-2"><IconBarChart className="w-5 h-5 text-emerald-500"/> Scenario Simulator</h2>
                                    <div className="flex gap-4">
                                        <div className="flex flex-col gap-1">
                                            <label className="text-xs text-slate-500 dark:text-slate-400">Payment Delays ({delayDays}d)</label>
                                            <input type="range" min="0" max="30" value={delayDays} onChange={e => setDelayDays(parseInt(e.target.value))} className="w-24 sm:w-32 accent-emerald-500" />
                                        </div>
                                        <div className="flex flex-col gap-1">
                                            <label className="text-xs text-slate-500 dark:text-slate-400">Vol Multiplier ({volumeMult}x)</label>
                                            <input type="range" min="0.5" max="2.0" step="0.1" value={volumeMult} onChange={e => setVolumeMult(parseFloat(e.target.value))} className="w-24 sm:w-32 accent-blue-500" />
                                        </div>
                                    </div>
                                </div>
                                <div className="h-80 w-full">
                                    <ResponsiveContainer width="100%" height="100%">
                                        <ComposedChart data={chartData} margin={{top: 10, right: 10, bottom: 0, left: 0}}>
                                            <CartesianGrid strokeDasharray="3 3" vertical={false} />
                                            <XAxis dataKey="day" stroke="#94a3b8" tick={{fontSize: 12}} tickMargin={10} axisLine={false} />
                                            <YAxis stroke="#94a3b8" tick={{fontSize: 12}} tickFormatter={(val) => `₹${val/1000}k`} axisLine={false} tickLine={false} />
                                            <Tooltip formatter={(value) => `₹${value.toLocaleString()}`} />
                                            <Legend verticalAlign="top" height={36} iconType="circle" />
                                            <Area type="monotone" name="Confidence Range" dataKey="confidenceMax" fill="#10b981" fillOpacity={0.15} stroke="none" />
                                            <Area type="monotone" dataKey="confidenceMin" fill={isDark ? "#151e2e" : "#ffffff"} fillOpacity={1} stroke="none" tooltipType="none" legendType="none" />
                                            <Line type="monotone" name="Projected Cash Flow" dataKey="projected" stroke="#10b981" strokeWidth={3} dot={false} activeDot={{r: 6}} />
                                            <Line type="monotone" name="Expected Baseline" dataKey="expected" stroke="#94a3b8" strokeWidth={2} strokeDasharray="4 4" dot={false} />
                                        </ComposedChart>
                                    </ResponsiveContainer>
                                </div>
                            </div>
                            
                            <div className="bg-white dark:bg-slate-850 border border-slate-200 dark:border-slate-700 rounded-xl overflow-hidden shadow-sm dark:shadow-lg flex flex-col h-[350px]">
                                <div className="p-4 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center bg-slate-50 dark:bg-slate-800">
                                    <h2 className="text-lg font-semibold flex items-center gap-2"><IconSearch className="w-5 h-5 text-blue-500"/> Live Reconciliation Feed</h2>
                                </div>
                                <div className="flex-1 overflow-y-auto p-4 space-y-2">
                                    {transactions.map(txn => (
                                        <div key={txn.id} className={`flex justify-between items-center p-3.5 rounded-lg border transition-all ${
                                            txn.status === 'Matched' ? 'border-emerald-200 dark:border-emerald-900 bg-emerald-50 dark:bg-emerald-900/20' 
                                            : txn.status === 'Mismatched' ? 'border-amber-300 dark:border-amber-700 bg-amber-50 dark:bg-amber-900/20' 
                                            : 'border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800'
                                        }`}>
                                            <div className="flex items-center gap-4">
                                                {txn.status === 'Matched' ? <IconCheckCircle className="w-5 h-5 text-emerald-500" /> : txn.status === 'Mismatched' ? <IconAlertTriangle className="w-5 h-5 text-amber-500" /> : <IconClock className="w-5 h-5 text-slate-500" />}
                                                <div>
                                                    <div className="font-medium">{txn.id}</div>
                                                    <div className="text-xs text-slate-500 flex items-center gap-2 mt-0.5"><span>{txn.gateway}</span><span>{txn.time}</span></div>
                                                </div>
                                            </div>
                                            <div className="text-right">
                                                <div className="font-medium font-mono">₹{txn.amount.toLocaleString()}</div>
                                                <div className={`text-xs mt-0.5 font-medium ${txn.status === 'Matched' ? 'text-emerald-500' : txn.status === 'Mismatched' ? 'text-amber-500' : 'text-slate-500'}`}>{txn.status}</div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>

                        <div className="space-y-6 flex flex-col">
                            <div className="bg-gradient-to-br from-indigo-50 dark:from-indigo-900/60 to-white dark:to-slate-850 border border-indigo-200 dark:border-indigo-500/30 rounded-xl p-6 shadow-sm dark:shadow-lg">
                                <h2 className="text-lg font-semibold flex items-center gap-2 mb-4 text-indigo-600 dark:text-indigo-300"><IconBrain className="w-5 h-5"/> Daily Voice Brief</h2>
                                <p className="text-slate-600 dark:text-slate-300 text-sm leading-relaxed mb-4">{briefText}</p>
                                <div className="flex gap-2">
                                    <button onClick={playVoiceBrief} className="flex-1 flex items-center justify-center gap-2 text-xs font-semibold bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2.5 rounded-lg transition-all shadow-md active:scale-95"><IconPlay className="w-4 h-4"/> Play Audio</button>
                                    <button onClick={generateBrief} className="flex items-center justify-center p-2.5 rounded-lg bg-indigo-100 dark:bg-indigo-900 text-indigo-600 dark:text-indigo-300 hover:bg-indigo-200 dark:hover:bg-indigo-800 transition-colors"><IconRefresh className="w-4 h-4"/></button>
                                </div>
                            </div>
                            
                            <div className="bg-white dark:bg-slate-850 border border-slate-200 dark:border-slate-700 rounded-xl p-6 shadow-sm dark:shadow-lg">
                                <h2 className="text-lg font-semibold flex items-center gap-2 mb-4"><IconShieldCheck className="w-5 h-5 text-purple-500"/> Compliance Calendar</h2>
                                <div className="space-y-3">
                                    {calendar.map((item, i) => (
                                        <div key={i} className="flex items-start gap-3 p-2 rounded bg-purple-50 dark:bg-purple-900/20 border border-purple-100 dark:border-purple-800/50">
                                            <div className="w-2 h-2 mt-1.5 rounded-full bg-purple-500 shrink-0"></div>
                                            <span className="text-sm font-medium text-slate-700 dark:text-slate-300">{item}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="bg-white dark:bg-slate-850 border border-slate-200 dark:border-slate-700 rounded-xl flex flex-col flex-1 min-h-[300px] shadow-sm dark:shadow-lg">
                                <div className="p-4 border-b border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800">
                                    <h2 className="text-lg font-semibold flex items-center gap-2"><IconClock className="w-5 h-5 text-slate-500"/> Blockchain Audit Trail</h2>
                                </div>
                                <div className="flex-1 overflow-y-auto p-4 space-y-4">
                                    {auditLog.map((log, idx) => (
                                        <div key={idx} className="flex gap-3 text-sm border-b border-slate-100 dark:border-slate-800 pb-3 last:border-0">
                                            <div>
                                                <div className="text-slate-700 dark:text-slate-300 leading-snug">{log.action}</div>
                                                <div className="text-xs text-slate-500 mt-1 flex items-center gap-2 font-mono" title={log.hash}>
                                                    <span className="text-emerald-500 font-semibold">{log.agent}</span>
                                                    <span>•</span> <span>{log.time}</span>
                                                    <span>•</span> <span className="text-slate-400 truncate w-20" title={log.hash}>{log.hash ? log.hash.substring(0,8) + '...' : ''}</span>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    {/* Copilot Chat Button/Panel */}
                    <div className={`fixed bottom-6 right-6 flex flex-col items-end z-50`}>
                        {chatOpen && (
                            <div className="bg-white dark:bg-slate-850 w-80 md:w-96 rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-700 mb-4 flex flex-col h-96 overflow-hidden animate-slide-up">
                                <div className="bg-indigo-600 p-4 text-white flex justify-between items-center">
                                    <div className="font-semibold flex items-center gap-2"><IconChat className="w-5 h-5"/> Finance Copilot</div>
                                    <button onClick={() => setChatOpen(false)}><IconX className="w-5 h-5"/></button>
                                </div>
                                <div className="flex-1 p-4 overflow-y-auto space-y-3 bg-slate-50 dark:bg-slate-900">
                                    {chatMsgs.map((m, i) => (
                                        <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                            <div className={`p-3 rounded-lg max-w-[85%] text-sm ${m.role === 'user' ? 'bg-indigo-600 text-white rounded-br-none' : 'bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 dark:text-slate-200 rounded-bl-none'}`}>
                                                {m.text}
                                            </div>
                                        </div>
                                    ))}
                                    <div ref={chatEndRef}/>
                                </div>
                                <form onSubmit={sendChat} className="p-3 border-t border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-850 flex gap-2">
                                    <input value={chatInput} onChange={e => setChatInput(e.target.value)} type="text" placeholder="Ask about cash flow..." className="flex-1 bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 text-sm outline-none focus:border-indigo-500" />
                                    <button type="submit" className="bg-indigo-600 text-white px-3 rounded-lg hover:bg-indigo-700 transition-colors">→</button>
                                </form>
                            </div>
                        )}
                        {!chatOpen && (
                            <button onClick={() => setChatOpen(true)} className="bg-indigo-600 text-white p-4 rounded-full shadow-2xl hover:bg-indigo-700 transition-transform hover:scale-105 active:scale-95">
                                <IconChat className="w-6 h-6"/>
                            </button>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
